# BundLeJEPA — unified configuration template
#
# Set 'method' to either 'ijepa' or 'lejepa'.
# The backbone choice and all hyper-parameters are controlled from this file.
#
# Quick-start (no GPU cluster needed):
#   method: lejepa, backbone.name: vit, data.dataset: imagenette

method: lejepa   # ijepa | lejepa


# ── Backbone ──────────────────────────────────────────────────────────────────
#
# name: vit | resnet18 | resnet50
#
#   vit + method=ijepa   → custom ViT in src/ijepa/models/vision_transformer.py
#                          Requires: vit_size, patch_size, pred_depth, pred_emb_dim
#
#   vit + method=lejepa  → timm ViT (any model from timm.list_models)
#                          Requires: vit_model, emb_dim, proj_dim
#
#   resnet18/resnet50    → torchvision ResNet (method=lejepa only)
#                          Requires: emb_dim, proj_dim
backbone:
  name: vit

  # ── I-JEPA ViT (ignored when method=lejepa) ───────────────────────────────
  vit_size:     vit_small   # vit_tiny | vit_small | vit_base | vit_large | vit_huge | vit_giant
  patch_size:   16          # ViT patch size; also used by the I-JEPA mask collator
  pred_depth:   6           # predictor transformer depth
  pred_emb_dim: 384         # predictor embedding dimension

  # ── LeJEPA ViT (ignored when method=ijepa) ────────────────────────────────
  vit_model:  vit_small_patch16_224   # any timm ViT model name
  emb_dim:    512
  proj_dim:   128

  drop_path_rate: 0.1   # timm ViT (LeJEPA) only

  # ── LeJEPA ResNet (only when name=resnet18 or resnet50) ───────────────────
  # emb_dim and proj_dim are shared with the ViT keys above; no extra keys needed.


# ── Data ──────────────────────────────────────────────────────────────────────
data:
  dataset: imagenette   # imagenet1k | imagenet100 | imagenette | stl10 | phc_blob | phc_gpm

  batch_size:  256
  num_workers: 4
  pin_mem:     true

  crop_size:  128
  crop_scale: [0.08, 1.0]

  use_gaussian_blur:     true
  use_horizontal_flip:   true
  use_color_distortion:  true
  color_jitter_strength: 0.8

  # ── Multi-crop (DINO-style, LeJEPA) ──────────────────────────────────────
  num_global_crops:  2
  num_local_crops:   6
  global_crop_scale: [0.3, 1.0]
  local_crop_scale:  [0.05, 0.3]

  record_metadata: false

  # imagenet1k / imagenet100 paths (ignored for imagenette / stl10 / phc)
  root_path:         /path/to/datasets
  image_folder:      imagenet_full_size/
  copy_data:         false
  class_subset_file: null   # imagenet100 only


# ── I-JEPA masking ────────────────────────────────────────────────────────────
ijepa:
  allow_overlap:   false
  aspect_ratio:    [0.75, 1.5]
  enc_mask_scale:  [0.85, 1.0]
  min_keep:        10
  num_enc_masks:   1
  num_pred_masks:  4
  pred_mask_scale: [0.15, 0.2]


# ── LeJEPA loss ───────────────────────────────────────────────────────────────
lejepa:
  lamb:        0.02   # λ weighting SIGReg vs invariance
  num_classes: 10
  use_probe:   true


# ── Optimization ──────────────────────────────────────────────────────────────
optimization:
  use_bfloat16: true
  epochs:  100
  warmup:  10

  # ── I-JEPA optimizer ─────────────────────────────────────────────────────
  lr:                   1.0e-3
  start_lr:             2.0e-4
  final_lr:             1.0e-6
  weight_decay:         0.04
  final_weight_decay:   0.4
  ipe_scale:            1.0
  ema: [0.996, 1.0]

  # ── LeJEPA optimizer ─────────────────────────────────────────────────────
  probe_lr:            1.0e-3
  probe_weight_decay:  1.0e-7


# ── Logging & checkpointing ───────────────────────────────────────────────────
logging:
  folder:          logs/bundlejepa/
  write_tag:       bundlejepa
  load_checkpoint: false
  read_checkpoint: null
  use_wandb:       false
