defaults:
  - encoder: resnet18
  - _self_

_target_: src.models.lejepa_module.LeJEPAModule

embedding_dim: 128 #512
projection_dim: 16 #* ${model.embedding_dim} for projector: null
num_classes: 10

lamb: 0.02

# Regularization type: "sigreg" | "susreg" | "local_sigreg" | "local_ballreg"
loss_type: sigreg

# SIGReg sketch: number of random directions |A| and integration half-width
# (paper defaults for ViT-L/14 IN1K: 1024 slices, [-5, 5], 17 knots).
sigreg_num_slices: 256
sigreg_t_max: 3.0

num_global_crops: null

# Local regularization: k-means the batch in projection space, then applies a
# local regularizer inside each neighborhood. Used when loss_type is
# local_sigreg or local_ballreg.
local_sigreg_num_clusters: 8
local_sigreg_kmeans_iters: 10
local_sigreg_min_cluster_size: 4
local_sigreg_weighted: false
local_sigreg_normalize_for_kmeans: true
local_sigreg_kmeans_backend: fast_pytorch_kmeans # "fast_pytorch_kmeans" | "torch"

# Local BallReg: radius=null means sqrt(projection_dim + 2), so the target ball
# has identity covariance. center_clusters=true tests local residual geometry.
local_ballreg_radius: null
local_ballreg_center_clusters: true
local_ballreg_n_quad: 64

# Dynamic k schedule: when enabled, the local k-means neighborhood count is
# k = min(max, start + epoch // step_epochs), overriding local_sigreg_num_clusters
# per epoch. Defaults give k=1 -> k=8 (one step every 100 epochs, capped at 700).
dynamic_num_clusters: false
dynamic_num_clusters_start: 1
dynamic_num_clusters_max: 8
dynamic_num_clusters_step_epochs: 100

use_online_probe: true
probe_lr: 1e-3
probe_weight_decay: 1e-7
warmup_epochs: 1
lr_eta_min: 1e-3

optimizer: ${optimizer}

#* projector: null for nn.Identity()
projector:
  _target_: torchvision.ops.MLP
  in_channels: ${model.embedding_dim}
  hidden_channels:
    - 512 #2048
    - 512 # 2048
    - ${model.projection_dim}
  norm_layer:
    _target_: hydra.utils.get_class
    path: torch.nn.BatchNorm1d

online_probe:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: torch.nn.LayerNorm
      normalized_shape: ${model.embedding_dim}
    - _target_: torch.nn.Linear
      in_features: ${model.embedding_dim}
      out_features: ${model.num_classes}

compile: false
