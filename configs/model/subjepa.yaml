defaults:
  - encoder: resnet18
  - _self_

_target_: src.models.subjepa_module.SubJEPAModule

embedding_dim: 128 #512
projection_dim: 16 #* ${model.embedding_dim} for projector: null
num_classes: 10

lamb: 0.02

# Sub-JEPA (Zhao et al., arXiv:2605.09241) hyper-parameters
num_subspaces: 4

num_global_crops: null
use_online_probe: true
probe_lr: 1e-3
probe_weight_decay: 1e-7
warmup_epochs: 1

optimizer: ${optimizer}

#* projector: null for nn.Identity()
projector:
  _target_: torchvision.ops.MLP
  in_channels: ${model.embedding_dim}
  hidden_channels:
    - 512 #2048
    - 512 # 2048
    - ${model.projection_dim}
  norm_layer:
    _target_: hydra.utils.get_class
    path: torch.nn.BatchNorm1d

online_probe:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: torch.nn.LayerNorm
      normalized_shape: ${model.embedding_dim}
    - _target_: torch.nn.Linear
      in_features: ${model.embedding_dim}
      out_features: ${model.num_classes}

compile: false
