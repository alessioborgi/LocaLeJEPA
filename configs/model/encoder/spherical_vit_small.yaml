_target_: src.models.components.spherical_vit.SphericalViT

img_size: ${data.crop_size}
patch_size: 16
in_chans: 3
embed_dim: 384
depth: 12
num_heads: 6
num_classes: ${model.embedding_dim}   # GAP + linear head for LeJEPA; set to 0 for I-JEPA
sh_max_degree: 8                      # (8+1)^2 = 81 harmonics → projected to embed_dim
use_sph_attn_bias: true
sph_attn_num_bins: 64
