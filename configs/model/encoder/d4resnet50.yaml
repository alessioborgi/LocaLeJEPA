# D4-equivariant ResNet-50 (equivision / escnn): group convolutions over
# regular representations of D4 (rotations by 90 degrees + horizontal flips),
# ~24.4M params (base_width=25, matched to vanilla ResNet-50).
#
# pool: equivariant -> use the equivision backbone the way the paper's
# `forward_features` intends (residual body, no group pooling) and keep the
# output G-EQUIVARIANT: an equivariant 1x1 group-conv reduces the field count so
# (#fields * |D4|=8) == embedding_dim, then spatial pool -> (B, embedding_dim)
# that transforms under D4 by the regular representation, so the embedding
# keeps its orientation structure (pool: group would instead collapse it to a
# D4-invariant vector, the classifier head).
_target_: src.models.components.e2resnet.build_e2resnet
group: d4
depth: 50
num_classes: ${model.embedding_dim}
fixed_params: true
initialize: true
pool: equivariant
