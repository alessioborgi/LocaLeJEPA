defaults:
  - encoder: phc
  - _self_

_target_: src.models.phc_regression_module.PhCRegressionModule

embedding_dim: 1024

optimizer: ${optimizer}
scheduler: null

pretrained_ckpt_path: null
freeze_encoder: false
strict_encoder_load: true

scheduler_interval: epoch
scheduler_monitor: val/loss

predictor:
  _target_: src.models.components.phc.DOSPredictor
  emb_dim: ${model.embedding_dim}
  out_dim: ${data.udos}

compile: false
