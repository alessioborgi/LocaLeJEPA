defaults:
  - encoder: resnet18
  - _self_

_target_: src.models.rectifiedlpjepa_module.RectifiedLpJEPAModule

embedding_dim: 128 #512
projection_dim: 16 #* ${model.embedding_dim} for projector: null
num_classes: 10

lamb: 0.02 # unused by RDMReg; kept for JEPAModule scaffold compatibility

# --- Rectified LpJEPA (RDMReg) target distribution ---
# "rectified_lp_distribution" -> Rectified LpJEPA (match prod RGN_p, rectify feats)
# "lp_distribution"           -> LpJEPA baseline (match plain GN_p, no rectification)
target_distribution: rectified_lp_distribution

# ell_p parameter: p=1 -> Rectified Laplace, p=2 -> Rectified Gaussian
lp_norm_parameter: 1.0
# Location mu of the target; more negative -> sparser representations
mean_shift_value: 0.0
# Target scale: "sigma_GN" (unit pre-rectification GN variance) or a float
mode_of_sigma: sigma_GN
# Number of random 1-D sketch directions on the ell_2 sphere for slicing
num_projections: 256

# Two-weight loss combination (paper: lambda_sim=25, lambda_dist=125)
invariance_loss_weight: 25.0
rdm_reg_loss_weight: 125.0

num_global_crops: null

use_online_probe: true
probe_lr: 1e-3
probe_weight_decay: 1e-7
warmup_epochs: 1

optimizer: ${optimizer}

#* projector: null for nn.Identity(). RDMReg rectifies internally, so the
#* projector must NOT end with a ReLU.
projector:
  _target_: torchvision.ops.MLP
  in_channels: ${model.embedding_dim}
  hidden_channels:
    - 512 #2048
    - 512 # 2048
    - ${model.projection_dim}
  norm_layer:
    _target_: hydra.utils.get_class
    path: torch.nn.BatchNorm1d

online_probe:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: torch.nn.LayerNorm
      normalized_shape: ${model.embedding_dim}
    - _target_: torch.nn.Linear
      in_features: ${model.embedding_dim}
      out_features: ${model.num_classes}

compile: false
