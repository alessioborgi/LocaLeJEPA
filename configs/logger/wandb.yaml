# https://wandb.ai

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  name: ${hydra:job.override_dirname} # the CLI overrides, e.g. "experiment=lejepa/x,optimizer.lr=0.0003"; empty -> wandb picks one
  save_dir: "${paths.output_dir}"
  offline: ${oc.decode:${oc.env:WANDB_OFFLINE,False}} # True = log locally, False = log to wandb server
  id: null # pass correct id to resume experiment!
  anonymous: null # enable anonymous logging
  project: ${oc.env:WANDB_PROJECT,LocaLeJEPA}
  log_model: False # upload lightning ckpts
  prefix: "" # a string to put at the beginning of metric keys
  entity: ${oc.env:WANDB_ENTITY,null} # W&B team; unset -> your personal entity
  group: ""
  tags: []
  job_type: ""
