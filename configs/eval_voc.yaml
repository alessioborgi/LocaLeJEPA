# BundLeJEPA — VOC07+12 Faster R-CNN detection config
#
# Requires: detectron2 + ResNet-50 LeJEPA checkpoint
# Usage: python eval_voc.py --config configs/eval_voc.yaml

# ── Pretrained model ─────────────────────────────────────────────────────────
checkpoint:      logs/lejepa_rn50_in100/lejepa-latest.pth.tar
pretrain_config: logs/lejepa_rn50_in100/params-lejepa.yaml

# ── VOC dataset ───────────────────────────────────────────────────────────────
# Expected layout:
#   <voc_root>/VOC2007/Annotations  ImageSets  JPEGImages
#   <voc_root>/VOC2012/Annotations  ImageSets  JPEGImages
voc_root: /path/to/VOCdevkit

# ── Training ──────────────────────────────────────────────────────────────────
output_dir:   logs/voc_detection/
base_lr:      0.1
max_iter:     24000   # LR steps at 18k and 22k; linear warmup for 1k steps
warmup_iters: 1000
batch_size:   16
