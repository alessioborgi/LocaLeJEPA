# @package _global_
# BundLeJEPA (ViT baseline): ViT-S/8 + l_inv + l_sigreg + l_equivariance on Imagenette

defaults:
  - override /data: imagenette
  - override /model: bundlejepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["bundlejepa", "imagenette", "vit-small-p8", "sigreg", "equivariance"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  loss_type: sigreg
  use_equivariance: true
  eq_lambda: 0.4
  num_transforms: 4
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
