# @package _global_
# The MINIMAL.md recipe in the repository pipeline: ViT-S/8 + LocaLeReg (lambda 0.05,
# k = 4 k-means neighbourhoods) on Imagenette, 100 epochs, batch 256, lr 1e-3,
# 10-epoch warmup, gradient clipping 1.0, seed 44.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/reg_loss: localereg
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "vit-small-p8", "local-ballreg", "minimal"]

seed: 44

trainer:
  max_epochs: 100
  gradient_clip_val: 1.0

data:
  batch_size: 256
  num_workers: 8
  crop_size: 128

model:
  lr_eta_min_ratio: 1e-3
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 10
  lamb: 0.05
  reg_loss:
    num_clusters: 4
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

optimizer:
  lr: 1e-3
  weight_decay: 5e-2
