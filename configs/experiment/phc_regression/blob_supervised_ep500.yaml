# @package _global_

defaults:
  - /scheduler: cosine_annealing
  - override /data: phc_blob_labeled
  - override /model: phc_regression
  - override /model/encoder: phc
  - override /optimizer: adam
  - override /trainer: gpu
  - _self_

task_name: finetune
tags: ["phc", "blob", "regression", "supervised"]

trainer:
  max_epochs: 500
  num_sanity_val_steps: 0
  limit_val_batches: 0

model:
  scheduler: ${scheduler}

scheduler:
  T_max: ${trainer.max_epochs}
