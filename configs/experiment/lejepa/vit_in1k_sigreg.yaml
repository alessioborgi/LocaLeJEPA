# @package _global_
# LeJEPA (SIGReg) baseline with the plain timm ViT-S/8 on ImageNet-1K, 100 epochs.
# Same SSL protocol as the hvit / d4rn50 IN1K runs (crop 128, global batch 256,
# lr 2e-3, wd 5e-2, projector [2048, 2048, 16]) so the rows are directly comparable.

defaults:
  - override /data: imagenet1k
  - override /model: lejepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenet1k", "vit-small-p8", "sigreg"]

trainer:
  max_epochs: 100
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 8
  crop_size: 128
  copy_data: false

model:
  lr_eta_min_ratio: 0.5
  embedding_dim: 512
  projection_dim: 16
  num_classes: 1000
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
