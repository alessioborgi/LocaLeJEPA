# @package _global_
# Comparison Model 3 (ViT baseline): ViT-S/8 + l_inv + l_sfrik on Imagenette (800 epochs)
# SFRIK loss from Zheng et al., "Spectral Feature Regularization for Improved Kernel Risk
# Minimization over Hyperspherical Representations", ICLR 2023.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "vit-small-p8", "sfrik", "comparison"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  loss_type: sfrik
  b1: 1.0
  b2: 40.0
  b3: 40.0
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
