# @package _global_

defaults:
  - override /data: imagenet100
  - override /data/transform/image@data.train_transform: lejepa_multicrop
  - override /model: lejepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenet100", "vit-small-p16"]

trainer:
  max_epochs: 500
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 8
  crop_size: 224
  copy_data: false
  train_transform:
    num_global_crops: 2
    num_local_crops: 6

model:
  embedding_dim: 384
  projection_dim: 128
  num_classes: 100
  use_online_probe: true
  num_global_crops: ${data.train_transform.num_global_crops}
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch16_224
    drop_path_rate: 0.1

optimizer:
  lr: 5e-4
  weight_decay: 5e-2
