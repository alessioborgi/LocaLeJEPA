# @package _global_

# LeJEPA (SIGReg) pretraining on ImageNet-1K with the Hyperbolic ViT-S/8
# (Poincare-ball embedding, hyp_metric-style) in place of the plain ViT-S/8.
# Same SSL protocol as lejepa/vits8_in1k_ep800: crop 128, global batch 256.

defaults:
  - override /data: imagenet1k
  - override /model: lejepa
  - override /model/encoder: hvit_small_p8
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenet1k", "hvit-small-p8", "hyperbolic", "sigreg"]

trainer:
  max_epochs: 100   # launched with trainer.max_epochs=100 (config previously said 800)
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 8
  crop_size: 128
  copy_data: false

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 1000
  loss_type: sigreg
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
