# @package _global_

defaults:
  - override /data: imagenet100
  - override /data/transform/image@data.train_transform: lejepa_multicrop
  - override /model: lejepa
  - override /model/encoder: resnet50
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenet100", "resnet50"]

trainer:
  max_epochs: 500
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 8
  crop_size: 224
  copy_data: false
  train_transform:
    num_global_crops: 2
    num_local_crops: 6

