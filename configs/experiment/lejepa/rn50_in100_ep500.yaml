# @package _global_

defaults:
  - override /data: imagenet100
  - override /data/transform/image@data.train_transform: lejepa_multicrop
  - override /model: lejepa
  - override /model/backbone: resnet50
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenet100", "resnet50"]

trainer:
  max_epochs: 500

data:
  batch_size: 256
  num_workers: 8
  crop_size: 224
  copy_data: false
  train_transform:
    num_global_crops: 2
    num_local_crops: 6

model:
  embedding_dim: 2048
  projection_dim: 128
  num_classes: 100
  use_online_probe: true
  num_global_crops: ${data.train_transform.num_global_crops}
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 5e-4
  weight_decay: 5e-4
