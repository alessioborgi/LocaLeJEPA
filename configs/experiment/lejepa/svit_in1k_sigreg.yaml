# @package _global_
# Comparison Model 1: SphericalViT-S/8 + l_inv + l_sigreg on ImageNet-1K (800 epochs)

defaults:
  - override /data: imagenet1k
  - override /model: lejepa
  - override /model/encoder: spherical_vit_small_p8
  - override /optimizer: adam
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenet1k", "spherical-vit-small-p8", "sigreg", "comparison"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 8
  crop_size: 128
  copy_data: false

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 1000
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
