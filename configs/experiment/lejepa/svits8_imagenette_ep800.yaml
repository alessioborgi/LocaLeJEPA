# @package _global_

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/encoder: spherical_vit_small_p8
  - override /optimizer: adam
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "spherical-vit-small-p8"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
