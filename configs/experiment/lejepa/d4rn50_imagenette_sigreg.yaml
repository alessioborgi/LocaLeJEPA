# @package _global_
# Equivariant comparison model: D4-equivariant ResNet-50 (equivision / escnn)
# + l_inv + l_sigreg on Imagenette (800 epochs). Identical protocol to
# lejepa/vit_imagenette_sigreg with only the encoder swapped, so the frozen
# backbone drops straight into the Yoda probe comparison table.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/encoder: d4resnet50
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "d4resnet50", "equivariant", "sigreg", "comparison"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  loss_type: sigreg
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
