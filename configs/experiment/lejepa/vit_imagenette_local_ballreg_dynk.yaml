# @package _global_
# LeJEPA (ViT baseline): ViT-S/8 + l_inv + local BallReg on Imagenette, with a
# DYNAMIC k schedule for the local k-means neighborhoods. k starts at 1 and steps
# up by one every 100 epochs, capping at 8 from epoch 700 on (k=1 @0, k=2 @100,
# ..., k=8 @700). Fixed lambda=0.1. Uses the stabilized recipe (LR 1e-3, 10-epoch
# warmup, gradient clipping 1.0) proven healthy for the local regularizers.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "vit-small-p8", "local-ballreg", "dynamic-k", "comparison"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 10
  lamb: 0.1
  loss_type: local_ballreg
  local_sigreg_num_clusters: 1        # overridden per-epoch by the dynamic schedule
  local_sigreg_kmeans_iters: 10
  local_sigreg_min_cluster_size: 4
  local_sigreg_weighted: false
  local_sigreg_normalize_for_kmeans: true
  local_sigreg_kmeans_backend: fast_pytorch_kmeans
  local_ballreg_radius: null
  local_ballreg_center_clusters: true
  local_ballreg_n_quad: 64
  dynamic_num_clusters: true
  dynamic_num_clusters_start: 1
  dynamic_num_clusters_max: 8
  dynamic_num_clusters_step_epochs: 100
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

optimizer:
  lr: 1e-3
  weight_decay: 5e-2
