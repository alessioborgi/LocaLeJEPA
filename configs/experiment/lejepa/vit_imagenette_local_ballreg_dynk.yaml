# @package _global_
# LeJEPA (ViT baseline): ViT-S/8 + l_inv + local BallReg on Imagenette, with a
# DYNAMIC k schedule for the local k-means neighborhoods. k starts at 1 and steps
# up by one every 100 epochs, capping at 8 from epoch 700 on (k=1 @0, k=2 @100,
# ..., k=8 @700). Fixed lambda=0.1. Uses the stabilized recipe (LR 1e-3, 10-epoch
# warmup, gradient clipping 1.0) proven healthy for the local regularizers.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/reg_loss: localereg
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - override /callbacks: dynamic_num_clusters
  - _self_

tags: ["lejepa", "imagenette", "vit-small-p8", "local-ballreg", "dynamic-k", "comparison"]

trainer:
  max_epochs: 800
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 10
  lamb: 0.1
  reg_loss:
    num_clusters: 1
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

callbacks:
  dynamic_num_clusters:
    start: 1
    max: 8
    step_epochs: 100

optimizer:
  lr: 1e-3
  weight_decay: 5e-2
