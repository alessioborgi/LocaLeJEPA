# @package _global_

defaults:
  - override /data: stl10
  - override /data/transform/image@data.train_transform: lejepa_multicrop
  - override /model: lejepa
  - override /model/encoder: resnet18
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "stl10", "resnet18"]

trainer:
  max_epochs: 500

data:
  batch_size: 256
  num_workers: 8
  crop_size: 224
  train_transform:
    num_global_crops: 2
    num_local_crops: 6

model:
  lr_eta_min_ratio: 2.0
  embedding_dim: 512
  projection_dim: 128
  num_classes: 10
  use_online_probe: false
  num_global_crops: ${data.train_transform.num_global_crops}
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 5e-4
  weight_decay: 5e-4

# No online probe here, so val/probe_acc is not logged: fall back to keeping the
# last checkpoint instead of monitoring the (absent) best-representation metric.
callbacks:
  model_checkpoint:
    monitor: null
