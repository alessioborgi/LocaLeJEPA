# @package _global_
# Comparison Model: nViT-S/8 + l_inv + l_sigreg on Imagenette (800 epochs)
# nViT = nGPT ViT with learned PE table; no spherical harmonic PE / RPB.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/encoder: nvit_small_p8
  - override /optimizer: adam
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "nvit-small-p8", "sigreg", "comparison"]

trainer:
  max_epochs: 800
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 4
  crop_size: 128

model:
  lr_eta_min_ratio: 0.5
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
