# @package _global_

defaults:
  - override /data: phc_gpm
  - override /model: lejepa
  - override /model/encoder: phc
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "phc_gpm", "phc"]

trainer:
  max_epochs: 250
  num_sanity_val_steps: 0
  limit_val_batches: 0

data:
  batch_size: 512
  num_workers: 4
  train_transform:
    num_views: 2

model:
  embedding_dim: 1024
  projection_dim: 128
  use_online_probe: false
  online_probe: null
  num_global_crops: null
  projector:
    hidden_channels:
      - 512
      - ${model.projection_dim}

optimizer:
  lr: 5e-4
  weight_decay: 1e-4
