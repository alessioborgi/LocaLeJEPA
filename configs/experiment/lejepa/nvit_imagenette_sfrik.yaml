# @package _global_
# Comparison Model: nViT-S/8 + l_inv + l_sfrik on Imagenette (800 epochs)
# SFRIK loss from Zheng et al., "Spectral Feature Regularization for Improved Kernel Risk
# Minimization over Hyperspherical Representations", ICLR 2023.
# nViT = nGPT ViT with learned PE table; no spherical harmonic PE / RPB.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/encoder: nvit_small_p8
  - override /optimizer: adam
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "nvit-small-p8", "sfrik", "comparison"]

trainer:
  max_epochs: 800
  gradient_clip_val: 1.0

data:
  batch_size: 256
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 128
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  loss_type: sfrik
  lamb: 0.02
  b1: 1.0
  b2: 10.0
  b3: 10.0
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
