# @package _global_
# Hyperbolic ViT-S/8 + local BallReg (λ0.1, k4) (LeJEPA local regularizer) on ImageNet-1K, 100
# epochs. Stabilized recipe (lr 1e-3, warmup 10, grad-clip 1.0 via CLI).

defaults:
  - override /data: imagenet1k
  - override /model: lejepa
  - override /model/encoder: hvit_small_p8
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenet1k", "hvit", "hyperbolic", "local-ballreg"]

trainer:
  max_epochs: 100

data:
  batch_size: 256
  num_workers: 8
  crop_size: 128
  copy_data: false

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 1000
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 10
  lamb: 0.1
  loss_type: local_ballreg
  local_sigreg_num_clusters: 4
  local_sigreg_kmeans_iters: 10
  local_sigreg_min_cluster_size: 4
  local_sigreg_weighted: false
  local_sigreg_normalize_for_kmeans: true
  local_sigreg_kmeans_backend: fast_pytorch_kmeans
  local_ballreg_radius: null
  local_ballreg_center_clusters: true
  local_ballreg_n_quad: 64
  dynamic_num_clusters: false
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 1e-3
  weight_decay: 5e-2
