# @package _global_
# Our model on Imagenette: ViT-S/8 + l_inv + local BallReg (lambda 0.1, k = 4 k-means
# neighbourhoods), 800 epochs, with the stabilized recipe (lr 1e-3, 10-epoch warmup,
# gradient clipping 1.0). This is the Imagenette counterpart of vit_in1k_localballreg_l01_k4
# and consolidates the former sweep launcher (the former sweep launcher with
# LOSS=local_ballreg LAMB=0.1 KCL=4) into one config; the per-step batch 64 x 4 accumulation
# is what was launched.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "vit-small-p8", "local-ballreg", "comparison"]

trainer:
  max_epochs: 800
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 10
  lamb: 0.1
  loss_type: local_ballreg
  local_sigreg_num_clusters: 4
  local_sigreg_kmeans_iters: 10
  local_sigreg_min_cluster_size: 4
  local_sigreg_weighted: false
  local_sigreg_normalize_for_kmeans: true
  local_sigreg_kmeans_backend: fast_pytorch_kmeans
  local_ballreg_radius: null
  local_ballreg_center_clusters: true
  local_ballreg_n_quad: 64
  dynamic_num_clusters: false
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

optimizer:
  lr: 1e-3
  weight_decay: 5e-2
