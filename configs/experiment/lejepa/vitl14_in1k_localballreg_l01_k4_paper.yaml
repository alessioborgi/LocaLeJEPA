# @package _global_
# Our model -- LeJEPA + local BallReg (lambda 0.1, k = 4 k-means neighbourhoods on the
# global views) -- trained with the *paper's* ImageNet-1K setting (LeJEPA, arXiv:2511.08544,
# Sec. 6.1 / Table 1), identical to vitl14_in1k_sigreg_paper except for the regularizer
# and the stabilizers of our IN1K recipe (grad-clip 1.0 via CLI): ViT-L/14 (304M params),
# 224 px global views x2 + 98 px local views x8 (paper: 96; 98 = 7 x 14), 100 epochs,
# global batch 256, AdamW lr 5e-4 / wd 0.1 (paper grid {5e-3, 5e-4} x {1e-1, 1e-2, 1e-5}),
# linear warm-up + cosine, lambda 0.1 / k 4 local BallReg (our validated IN1K setting),
# 3-layer projector -> 64-d (Table 1d best), no predictor / registers / EMA.
# Run with trainer=ddp (4 GPUs, 64 samples per GPU): scripts/slurm_submit.sh with GPUS=4.

defaults:
  - override /data: imagenet1k
  - override /data/transform/image@data.train_transform: lejepa_multicrop_paper
  - override /model: lejepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: ddp
  - _self_

tags: ["lejepa", "imagenet1k", "vit-large-p14", "local-ballreg", "paper-setting"]

trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  devices: 4

data:
  batch_size: 256          # global batch; the datamodule divides by world_size
  num_workers: 8
  crop_size: 224
  copy_data: false
  train_transform:
    num_global_crops: 2
    num_local_crops: 8

model:
  embedding_dim: 1024      # native ViT-L width (timm head 1024 -> 1024)
  projection_dim: 64
  num_classes: 1000
  lamb: 0.1
  loss_type: local_ballreg
  local_sigreg_num_clusters: 4
  local_sigreg_kmeans_iters: 10
  local_sigreg_min_cluster_size: 4
  local_sigreg_weighted: false
  local_sigreg_normalize_for_kmeans: true
  local_sigreg_kmeans_backend: fast_pytorch_kmeans
  local_ballreg_radius: null
  local_ballreg_center_clusters: true
  local_ballreg_n_quad: 64
  dynamic_num_clusters: false
  use_online_probe: true
  num_global_crops: ${data.train_transform.num_global_crops}
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 10
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_large_patch14_224
    dynamic_img_size: true   # lets the 98 px local crops through the 224 px pos-embed
    drop_path_rate: 0.1

optimizer:
  lr: 5e-4
  weight_decay: 1e-1
