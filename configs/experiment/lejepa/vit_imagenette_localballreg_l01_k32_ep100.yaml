# @package _global_
# Fixed k=32 for the k x lr grid; recipe as in k-schedule except lr and lr_eta_min, set from the CLI.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/reg_loss: localereg
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "vit-small-p8", "local-ballreg", "k-lr", "fixed-k32"]

seed: 42

trainer:
  max_epochs: 100
  gradient_clip_val: 1.0

data:
  batch_size: 256
  num_workers: 11
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 3
  lamb: 0.1
  reg_loss:
    num_clusters: 32
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224
    grad_checkpointing: true # batch 256 x 4 views x 257 tokens does not fit 40 GiB otherwise

optimizer:
  lr: 1e-3
  weight_decay: 5e-2

logger:
  wandb:
    group: "k-study"
