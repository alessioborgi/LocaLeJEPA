# @package _global_
# Global SIGReg (LeJEPA). Its Gaussian target is contractible, so it should fill the circles in.
# COIL-100 is 100 objects x 72 turntable poses, so the image manifold is 100 disjoint
# circles. Augmentations are appearance-only: any geometric view would confound with pose.

defaults:
  - override /data: coil100
  - override /model: lejepa
  - override /model/reg_loss: sigreg
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - override /callbacks: coil
  - _self_

tags: ["lejepa", "coil100", "vit-small-p8", "topology", "sigreg"]

seed: 42

trainer:
  max_epochs: 100
  gradient_clip_val: 1.0

data:
  batch_size: 256
  num_workers: 6
  persistent_workers: false
  crop_size: 128
  val_pose_stride: 6

model:
  lr_eta_min_ratio: 1.0
  embedding_dim: 512
  projection_dim: 16
  num_classes: 100
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 10
  lamb: 0.1
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224
    grad_checkpointing: true # batch 256 x 4 views x 257 tokens does not fit 40 GiB otherwise

optimizer:
  lr: 1e-3
  weight_decay: 5e-2

logger:
  wandb:
    name: "COIL-SIGReg"
    group: "coil100-topology"
