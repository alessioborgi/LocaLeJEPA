# @package _global_
# Fixed k=1: no locality, the global ball statistic, and the reference for the reversed ramp's endpoint.
# 100 epochs on Imagenette, batch 256, D=16. Cluster size is B/k, so k=16 is the point
# where a cluster holds only D samples. Recipe: lr 1e-3, 3-epoch warmup, clip 1.0, lambda 0.1.

defaults:
  - override /data: imagenette
  - override /model: lejepa
  - override /model/reg_loss: localereg
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["lejepa", "imagenette", "vit-small-p8", "local-ballreg", "k-schedule", "fixed-k1"]

seed: 42

trainer:
  max_epochs: 100
  gradient_clip_val: 1.0

data:
  batch_size: 256
  num_workers: 11
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  warmup_epochs: 3
  lamb: 0.1
  reg_loss:
    num_clusters: 1
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224
    grad_checkpointing: true # batch 256 x 4 views x 257 tokens does not fit 40 GiB otherwise

optimizer:
  lr: 1e-3
  weight_decay: 5e-2

logger:
  wandb:
    group: "k-study"
