# @package _global_
# Common recipe of the three ablation tables: LocaLe-Reg (lambda 0.2, k 4) on Imagenette with the
# Euclidean ViT-S/8, 100 epochs, batch 256 without accumulation (the regularizer, k-means and
# the optimizer all see 256 samples), one LR schedule for every run: lr 1e-3, 10 warm-up
# epochs, cosine to 1% of the peak, grad-clip 1.0, seed 42. Not run on its own: the sweeps inherit it.

defaults:
  - /experiment/lejepa/vit_imagenette_localballreg_l01_k4
  - _self_

seed: 42
tags: ["lejepa", "imagenette", "vit-small-p8", "localereg", "ablation"]

trainer:
  max_epochs: 100
  accumulate_grad_batches: 1

data:
  batch_size: 256

model:
  lamb: 0.2
  lr_eta_min_ratio: 0.01

callbacks:
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch

logger:
  wandb:
    group: ablations
