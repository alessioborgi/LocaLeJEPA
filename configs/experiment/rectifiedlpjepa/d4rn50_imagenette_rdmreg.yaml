# @package _global_
# Equivariant comparison model: D4-equivariant ResNet-50 (equivision / escnn)
# + Rectified LpJEPA (RDMReg, Rectified Laplace target, 25/125 weights) on
# Imagenette (800 epochs). Identical protocol to
# rectifiedlpjepa/vit_imagenette_rdmreg with only the encoder swapped, so the
# frozen backbone drops straight into the Yoda probe comparison table.

defaults:
  - override /data: imagenette
  - override /model: rectifiedlpjepa
  - override /model/encoder: d4resnet50
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["rectifiedlpjepa", "imagenette", "d4resnet50", "equivariant", "rdmreg", "comparison"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 4
  crop_size: 128

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10

  target_distribution: rectified_lp_distribution
  lp_norm_parameter: 1.0
  mean_shift_value: 0.0
  mode_of_sigma: sigma_GN
  num_projections: 256
  invariance_loss_weight: 25.0
  rdm_reg_loss_weight: 125.0

  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
