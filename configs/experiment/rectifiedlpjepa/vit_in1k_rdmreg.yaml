# @package _global_
# Rectified LpJEPA (RDMReg) with the plain timm ViT-S/8 on ImageNet-1K, 100 epochs -- the RDMReg
# column of the main table's ViT-S row (campaign plan; the config did not exist before C3).
# Same recipe as rectifiedlpjepa/hvit_in1k_rdmreg: crop 128, effective batch 256, lr 2e-3,
# wd 5e-2, cosine 2e-3 -> 1e-3, Rectified Laplace target with weights 25 / 125.
defaults:
  - override /data: imagenet1k
  - override /model: rectifiedlpjepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_
tags: ["rectifiedlpjepa", "imagenet1k", "vit-small-p8", "rdmreg"]
trainer:
  max_epochs: 100
  accumulate_grad_batches: 4
data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (4 GPUs: batch_size=256, accumulate 1)
  num_workers: 8
  crop_size: 128
  copy_data: false
model:
  lr_eta_min_ratio: 0.5
  embedding_dim: 512
  projection_dim: 16
  num_classes: 1000
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224
optimizer:
  lr: 2e-3
  weight_decay: 5e-2
