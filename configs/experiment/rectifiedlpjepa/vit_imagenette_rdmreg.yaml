# @package _global_
# Rectified LpJEPA (arXiv:2602.01456): ViT-S/8 + l_inv + RDMReg on Imagenette (800 epochs).
# Matches rectified projector features to a Rectified Laplace target (p=1, mu=0).

defaults:
  - override /data: imagenette
  - override /model: rectifiedlpjepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["rectifiedlpjepa", "imagenette", "vit-small-p8", "rdmreg", "sparse"]

trainer:
  max_epochs: 800
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 4
  crop_size: 128

