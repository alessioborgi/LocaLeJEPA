# @package _global_
# Rectified LpJEPA (arXiv:2602.01456): ViT-S/8 + l_inv + RDMReg on Imagenette (800 epochs).
# Matches rectified projector features to a Rectified Laplace target (p=1, mu=0).

defaults:
  - override /data: imagenette
  - override /model: rectifiedlpjepa
  - override /model/encoder: timm_vit
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["rectifiedlpjepa", "imagenette", "vit-small-p8", "rdmreg", "sparse"]

trainer:
  max_epochs: 800
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 4
  crop_size: 128

model:
  lr_eta_min_ratio: 0.5
  embedding_dim: 512
  projection_dim: 16
  num_classes: 10
  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}
  encoder:
    model_name: vit_small_patch8_224

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
