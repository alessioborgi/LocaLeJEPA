# @package _global_
# Hyperbolic comparison model: Hyperbolic ViT-S/8 (Poincare-ball embedding,
# hyp_metric-style) + Rectified LpJEPA (RDMReg, Rectified Laplace target,
# 25/125 weights) on Imagenette (800 epochs). Identical protocol to
# rectifiedlpjepa/vit_imagenette_rdmreg with only the encoder swapped, so the
# frozen backbone drops straight into the Yoda probe comparison table.

defaults:
  - override /data: imagenette
  - override /model: rectifiedlpjepa
  - override /model/encoder: hvit_small_p8
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["rectifiedlpjepa", "imagenette", "hvit-small-p8", "hyperbolic", "rdmreg", "comparison"]

trainer:
  max_epochs: 800
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 4
  crop_size: 128

