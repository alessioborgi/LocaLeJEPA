# @package _global_

# Rectified LpJEPA (RDMReg, Rectified Laplace target, 25/125 weights)
# pretraining on ImageNet-1K with the Hyperbolic ViT-S/8 (Poincare-ball
# embedding, hyp_metric-style) in place of the plain ViT-S/8. Same SSL
# protocol as the in1k LeJEPA runs: crop 128, global batch 256.

defaults:
  - override /data: imagenet1k
  - override /model: rectifiedlpjepa
  - override /model/encoder: hvit_small_p8
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["rectifiedlpjepa", "imagenet1k", "hvit-small-p8", "hyperbolic", "rdmreg"]

trainer:
  max_epochs: 100   # launched with trainer.max_epochs=100 (config previously said 800)
  accumulate_grad_batches: 4

data:
  batch_size: 64    # per-step batch; x accumulate_grad_batches=4 -> effective 256 (as launched)
  num_workers: 8
  crop_size: 128
  copy_data: false

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 1000

  target_distribution: rectified_lp_distribution
  lp_norm_parameter: 1.0
  mean_shift_value: 0.0
  mode_of_sigma: sigma_GN
  num_projections: 256
  invariance_loss_weight: 25.0
  rdm_reg_loss_weight: 125.0

  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 2e-3
  weight_decay: 5e-2
