# @package _global_

# Rectified LpJEPA (RDMReg) pretraining on ImageNet-1K with a D4-equivariant
# ResNet-50 encoder (equivision / escnn) in place of the ViT-S/8. Same RDMReg
# recipe as rectifiedlpjepa/vit_imagenette_rdmreg (Rectified Laplace target,
# lambda_sim=25 / lambda_dist=125), same SSL protocol as the in1k LeJEPA runs.

defaults:
  - override /data: imagenet1k
  - override /model: rectifiedlpjepa
  - override /model/encoder: d4resnet50
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["rectifiedlpjepa", "imagenet1k", "d4resnet50", "equivariant", "rdmreg"]

trainer:
  max_epochs: 800

data:
  batch_size: 256
  num_workers: 8
  crop_size: 128
  copy_data: false

model:
  embedding_dim: 512
  projection_dim: 16
  num_classes: 1000

  # Rectified LpJEPA: match prod RGN_p with p=1 (Rectified Laplace)
  target_distribution: rectified_lp_distribution
  lp_norm_parameter: 1.0
  mean_shift_value: 0.0
  mode_of_sigma: sigma_GN
  num_projections: 256
  invariance_loss_weight: 25.0
  rdm_reg_loss_weight: 125.0

  use_online_probe: true
  num_global_crops: null
  probe_lr: 1e-3
  probe_weight_decay: 1e-7
  projector:
    hidden_channels:
      - 2048
      - 2048
      - ${model.projection_dim}

optimizer:
  lr: 1e-3
  weight_decay: 5e-2
