# @package _global_

defaults:
  - override /data: imagenette_ijepa
  - override /model: ijepa
  - override /model/encoder: custom_ijepa_vit_small
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["ijepa", "imagenette", "vit-small-p16"]

trainer:
  max_epochs: 300

data:
  batch_size: 256
  num_workers: 4
  crop_size: 224
  collator:
    patch_size: ${model.encoder.patch_size}
    min_keep: 10

model:
  encoder:
    patch_size: 16
    embed_dim: 384
    num_heads: 6
  predictor:
    num_patches: 196
    depth: 6
    predictor_embed_dim: 384
  warmup_epochs: 40
  lr: 1e-3
  start_lr: 2e-4
  final_lr: 1e-6
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]

optimizer:
  lr: ${model.lr}
  weight_decay: ${model.weight_decay}
