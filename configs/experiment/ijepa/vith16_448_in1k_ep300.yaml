# @package _global_

defaults:
  - override /data: imagenet1k_ijepa
  - override /model: ijepa
  - override /model/encoder: custom_ijepa_vit_huge
  - override /optimizer: adamw
  - override /trainer: gpu
  - _self_

tags: ["ijepa", "imagenet1k", "vit-huge-p16-448"]

trainer:
  max_epochs: 300

data:
  batch_size: 16
  num_workers: 10
  crop_size: 448
  collator:
    patch_size: ${model.encoder.patch_size}
    min_keep: 10

model:
  encoder:
    patch_size: 16
    embed_dim: 1280
    num_heads: 16
  predictor:
    num_patches: 784
    depth: 12
    predictor_embed_dim: 384
  warmup_epochs: 40
  lr: 1e-3
  start_lr: 2e-4
  final_lr: 1e-6
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]

optimizer:
  lr: ${model.lr}
  weight_decay: ${model.weight_decay}
