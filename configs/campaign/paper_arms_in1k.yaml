# The PAPER'S OWN ARMS that the campaign never ran at ImageNet-1K, for the rebuttal revision. Decision 32
# (2026-10-08): the paper's main tables are replaced with campaign numbers, so every row they show must come
# from this pipeline -- one evaluation path, the final-epoch checkpoint, the stabilised recipe at cosine to
# peak/1000. The submitted paper reports these four arms on the hyperbolic ViT and the D4 ResNet only:
#
#   dynamic K   K=1 -> 10, +1 every 10 epochs (App. C: K_max 10, E_step 10), lambda 0.1. Its experiment config
#               starts at num_clusters 1 and DynamicNumClusters moves it; F87 (a mid-epoch resume after a wall
#               ran the rest of that epoch at K=1) is fixed in the callback, and D4 walls once.
#   LocaLeJEPA-SIGReg   the paper's local control: the same K=4 partition, Gaussian matching on UNCENTRED
#               clusters (locale_sigreg inherits sigreg's center: false), lambda 0.1.
#   K=2         lambda 0.1 and lambda 0.3 -- the paper's neighbourhood-size and weight rows. These take the K=4
#               arm's experiment config and override K (and lambda), exactly as the dedicated *_l01_k2
#               configs would.
#
# Effective strength lambda N/K at N=64 per shard: dynamic K 6.4 -> 0.64; LocaLeJEPA-SIGReg 1.6; K=2 3.2
# and 9.6. GEOMETRY identical to every arm they are compared against: 4 GPUs, batch 256, accumulate 1. D4
# blocks come first so the longest runs (~26-30 h, one wall + successor) start first. Tags reuse
# `{enc}_local` for the K=2 runs (their names cannot collide: k2 vs the existing k4). One seed, like every
# ImageNet cell. REHEARSAL: dynamic K and the uncentred local SIGReg have never run at ImageNet scale under
# 4-GPU DDP, so smoke_4gpu gains cells 12-15 that run BEFORE this wave.
name: paper_arms_in1k
seeds: [0]
gpus: 4
micro_batch: 64
max_epochs: 100
short: {model.lamb: lam, model.reg_loss.num_clusters: k}
blocks:
  - tag: d4rn50_dynk
    experiment: lejepa/d4rn50_in1k_localballreg_l01_dynk
    axes: {model.lamb: [0.1]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
  - tag: d4rn50_localsigreg
    experiment: lejepa/d4rn50_in1k_localsigreg_l01_k4
    axes: {model.lamb: [0.1], model.reg_loss.num_clusters: [4]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
  - tag: d4rn50_local
    experiment: lejepa/d4rn50_in1k_localballreg_l01_k4
    axes: {model.lamb: [0.1, 0.3], model.reg_loss.num_clusters: [2]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
  - tag: hvit_dynk
    experiment: lejepa/hvit_in1k_localballreg_l01_dynk
    axes: {model.lamb: [0.1]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
  - tag: hvit_localsigreg
    experiment: lejepa/hvit_in1k_localsigreg_l01_k4
    axes: {model.lamb: [0.1], model.reg_loss.num_clusters: [4]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
  - tag: hvit_local
    experiment: lejepa/hvit_in1k_localballreg_l01_k4
    axes: {model.lamb: [0.1, 0.3], model.reg_loss.num_clusters: [2]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
