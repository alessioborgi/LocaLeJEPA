# The DEBUG CYCLE, 4-GPU half: the ImageNet-1K shapes, including the two the campaign has broken
# on -- the D4-equivariant ResNet (escnn containers under DDP, F48) and the SIGReg CONTROL, whose
# experiment name contains "local" while its regularizer does not (F53). See smoke_1gpu.yaml.
name: smoke_4gpu
seeds: [0]
gpus: 4
micro_batch: 64
max_epochs: 2
blocks:
  - {tag: smoke_vit_in1k_sigreg,   experiment: lejepa/vit_in1k_sigreg,                 overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_hvit_in1k_sigreg,  experiment: lejepa/hvit_in1k_sigreg,                overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_d4rn50_in1k_sigreg, experiment: lejepa/d4rn50_in1k_sigreg,             overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_vit_in1k_local,    experiment: lejepa/vit_in1k_localballreg_l01_k4,    overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_vit_in1k_control,  experiment: lejepa/vit_in1k_sigreg_localrecipe,     overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  # The capacity grid's new shape (decision 25): a REDUCED-DEPTH encoder on the ImageNet data path,
  # under 4-GPU DDP. Depth alone is rehearsed at 1 GPU on Imagenette (smoke_1gpu), and 4-GPU DDP on
  # ImageNet is rehearsed by the cells above -- but the COMBINATION has never run, and a 180-cell
  # Imagenette wave's worth of GPU time now rides on it. Depth 3 is the extreme case; depth 6 is the
  # same code path with more layers.
  - {tag: smoke_vit_in1k_capdep,   experiment: lejepa/vit_in1k_localballreg_depth,     overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20, model.encoder.depth: 3}}
  # The two attribution controls (decision 26). Their encoder/regularizer pairings are already
  # rehearsed above at LeJEPA's published recipe, so what is new is only the optimiser settings -- but
  # both run through experiment configs that have never produced a job, and together they are 153
  # GPU-h with the D4 row needing two walls. D4 has form: F48 has it failing at model build under DDP,
  # F62 has the pair running out of wall with its successor budget spent. ~1.3 GPU-h each against that.
  - {tag: smoke_hvit_in1k_control,   experiment: lejepa/hvit_in1k_sigreg_localrecipe,   overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_d4rn50_in1k_control, experiment: lejepa/d4rn50_in1k_sigreg_localrecipe, overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  # Decision 29's controls. APPENDED so indices 0-7 do not move. The H-ViT and D4 LOCAL configs had no smoke
  # cell -- they were proven only by their 100-epoch production runs, the gap the new-wave guard's comment
  # names -- and `model.reg_loss.center: true` has never run in a training job (sigreg_loss's centring is
  # unit-tested, not rehearsed). The centred cell must actually set center=true, or it rehearses nothing new
  # (F58); a test pins that.
  - {tag: smoke_hvit_in1k_local,     experiment: lejepa/hvit_in1k_localballreg_l01_k4,     overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_d4rn50_in1k_local,   experiment: lejepa/d4rn50_in1k_localballreg_l01_k4,   overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_vit_in1k_centred,    experiment: lejepa/vit_in1k_sigreg_localrecipe,       overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20, model.reg_loss.center: true}}
  # Decision 30's centred local Gaussian. APPENDED so indices 0-10 do not move. local_sigreg_loss has never run
  # under 4-GPU DDP at ImageNet scale in this pipeline (only 1-GPU Imagenette: torus, target_and_centering), and
  # never at K=4 with centring. The cell must swap the reg_loss group AND centre, or it rehearses the local ball
  # again or an uncentred loss the run never takes (F58); a test pins both.
  - {tag: smoke_vit_in1k_localgauss, experiment: lejepa/vit_in1k_localballreg_l01_k4, overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20, model/reg_loss: locale_sigreg, model.reg_loss.loss.center: true}}
  # The rebuttal's arms (decision 32, paper_arms_in1k). APPENDED so indices 0-11 do not move. Dynamic K has never
  # run at ImageNet scale under 4-GPU DDP (only the Imagenette grids), and the uncentred local SIGReg never in this
  # pipeline at ImageNet scale. The dynamic-K cells compress the ramp (step_epochs 1, step 9) so the 2-epoch smoke
  # reaches the production endpoint K=10 -- at step_epochs 10 it would rehearse K=1 only (F58). `step` takes `++`:
  # the calibrate callbacks group has no `step` key, so a plain override would not compose there. Tests pin both.
  - {tag: smoke_hvit_in1k_dynk,          experiment: lejepa/hvit_in1k_localballreg_l01_dynk,   overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20, callbacks.dynamic_num_clusters.step_epochs: 1, ++callbacks.dynamic_num_clusters.step: 9}}
  - {tag: smoke_d4rn50_in1k_dynk,        experiment: lejepa/d4rn50_in1k_localballreg_l01_dynk, overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20, callbacks.dynamic_num_clusters.step_epochs: 1, ++callbacks.dynamic_num_clusters.step: 9}}
  - {tag: smoke_hvit_in1k_localsigreg,   experiment: lejepa/hvit_in1k_localsigreg_l01_k4,      overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
  - {tag: smoke_d4rn50_in1k_localsigreg, experiment: lejepa/d4rn50_in1k_localsigreg_l01_k4,    overrides: {logger: csv, trainer.max_epochs: 2, data.batch_size: 256, trainer.accumulate_grad_batches: 1, +trainer.limit_train_batches: 20}}
