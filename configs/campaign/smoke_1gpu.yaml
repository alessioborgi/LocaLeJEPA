# The DEBUG CYCLE, 1-GPU half (F56, 2026-09-23). Every distinct 1-GPU shape of the campaign, run
# through the REAL lifecycle -- preflight, staging, training to `max_epochs`, the epoch-end and
# on-exception callbacks, postflight, the `.verified` marker -- in about three minutes a cell.
#
# Why it exists: F50, F52, F53 and F54 were all found by wave-sized runs after hours of GPU time,
# and every one of them would have shown up in a two-epoch run that COMPLETES. The calibration
# grids do not: they are step-limited, so nothing in them ever reaches `max_epochs - 1`, which is
# where `last.ckpt`, the metrics merge and the done branch all live.
#
# The axes are chosen to be the ones that have actually broken: backbone (escnn, hyperbolic,
# spherical, nViT), world size (DDP conversion), dataset and staging, regularizer family (a local
# arm must log `train/local/*`, the SIGReg control must NOT be asked for it).
#
# `limit_train_batches` keeps the data volume small while the number of EPOCHS stays the thing that
# matters; validation is NOT limited, because the calibrate override set already claims
# `trainer.limit_val_batches` and a cell must compose under both modes (the test pins that).
# Every override is composed by tests/integration/test_campaign_manifests.py.
#
# A smoke cell MIRRORS its real cell's geometry and never imposes one: the four 800-epoch Imagenette
# rows run at their configs' own per-step 64 x accumulate 4 (`micro_batch: 64` per block) and only the
# ablation rows are 256 x 1. Getting that wrong made the spherical ViT run at batch 256 and die of CUDA
# OOM on a 95 GB card -- a geometry the campaign never uses (2026-09-23).
name: smoke_1gpu
seeds: [0]
gpus: 1
micro_batch: 256
max_epochs: 2
blocks:
  - {tag: smoke_vit_imagenette_sigreg, experiment: lejepa/vit_imagenette_sigreg,          micro_batch: 64, overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20}}
  - {tag: smoke_vit_imagenette_rdmreg, experiment: rectifiedlpjepa/vit_imagenette_rdmreg, micro_batch: 64, overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20}}
  - {tag: smoke_ablation_local,        experiment: ablations/base,                        overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20}}
  - {tag: smoke_ablation_dynk,         experiment: ablations/dynk,                        overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20}}
  # The capacity grid's two NEW experiment configs and both NEW depths (decision 24). These inherit the
  # manifest's `micro_batch: 256`, which is the geometry `capacity_grid_ep800` actually runs (b=256,
  # accumulate 1) -- the ablation rows' shape, not the 800-epoch rows' 64 x 4. Rehearsed because depth is
  # a brand-new axis: a depth-6 encoder has to train, write `last.ckpt` at `max_epochs - 1`, log
  # `train/local/*`, and pass postflight, and none of that had ever run at anything but depth 12.
  - {tag: smoke_capacity_dep6,         experiment: ablations/base_depth,                  overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20, model.encoder.depth: 6}}
  - {tag: smoke_capacity_dep3_dynk,    experiment: ablations/dynk_depth,                  overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20, model.encoder.depth: 3}}
  - {tag: smoke_svit_susreg,           experiment: lejepa/svit_imagenette_susreg,         micro_batch: 64, overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20}}
  - {tag: smoke_nvit_sigreg,           experiment: lejepa/nvit_imagenette_sigreg,         micro_batch: 64, overrides: {logger: csv, trainer.max_epochs: 2, +trainer.limit_train_batches: 20}}
