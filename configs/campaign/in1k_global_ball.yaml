# The GLOBAL BALL on ImageNet-1K: our target, no clustering. Decision 22, run 3.
#
# Why it exists: the IN1K evaluations give LocaLeJEPA +17.5 k-NN / +17.7 linear over LeJEPA on the plain
# ViT (state/10-PAPER-STATE.md, 2026-09-28), but that pair differs in the regularizer AND lr AND warm-up
# AND clipping AND lambda AND centring. The Imagenette grid says LOCALITY contributes ~0 of it
# (state/10, 2026-09-25), which leaves the compact TARGET as the live hypothesis -- and there is no
# global-ball run anywhere, at any scale, to test it. The draft's own (deleted) appendix calls this control
# "necessary": "Centered global BallReg and local Gaussian matching are therefore necessary controls".
#
# What it is: exactly the existing per-backbone local-ball arm with `num_clusters: 1`, so the ONLY
# difference from `in1k_local`'s arms is that the batch is not partitioned. Same recipe, same lambda, same
# centring, same everything else -- which is what makes A->B a pure target change and B->D a pure locality
# change at scale.
#
# Cost: 3 runs x 4 GPUs x ~12 h ~= 176 GPU-h. The ViT-S row alone carries the argument.
name: in1k_global_ball
seeds: [0]
gpus: 4
micro_batch: 64
max_epochs: 100
short: {model.lamb: lam, model.reg_loss.num_clusters: k}
blocks:
  - tag: vit_globalball
    experiment: lejepa/vit_in1k_localballreg_l01_k4
    axes: {model.lamb: [0.1], model.reg_loss.num_clusters: [1]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
  - tag: hvit_globalball
    experiment: lejepa/hvit_in1k_localballreg_l01_k4
    axes: {model.lamb: [0.1], model.reg_loss.num_clusters: [1]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
  - tag: d4rn50_globalball
    experiment: lejepa/d4rn50_in1k_localballreg_l01_k4
    axes: {model.lamb: [0.1], model.reg_loss.num_clusters: [1]}
    overrides: {logger: csv, data.batch_size: 256, trainer.accumulate_grad_batches: 1}
