# Learning-curve evaluation for the Hyperbolic-ViT geometric sweep: leave-one-out
# cosine k-NN top-1 and the within/cross-class Ollivier-Ricci curvature gap on
# the frozen 512-d encoder at every 25-epoch snapshot.
#
# WHY THIS EXISTS: the manuscript's Table 2 (ImageNet-1K, D4-RN50 + Hyperbolic
# ViT-S/8) reports its BallReg gains at 100 EPOCHS. Every arm here keeps
# snapshots, so the 100-epoch reading and the 800-epoch one come off the SAME
# run -- the direct test of whether the local advantage is a convergence-SPEED
# effect that has closed by 800, which is the live explanation for why LeJEPA
# and LocaLeJEPA tie at 800 epochs on Imagenette.
#
#   sbatch src/slurm_files/slurm_diufrd_eval_snapshots_geometric.sh
#   # or one run directly:
#   python eval_snapshots.py --config configs/eval_snapshots_geometric.yaml --only hvit_locale_k4
#
# Then, for the table this was built to produce:
#   python scripts/snapshot_horizon_table.py --data logs/eval_snapshots_geometric
#
# WHAT THIS IS NOT COMPARABLE TO: Table 2 itself. That is ImageNet-1K with 1000
# classes at 23-44% accuracy; this is Imagenette with 10 at ~90%. Only the
# EPOCH HORIZON is shared. The comparison that means something is internal --
# LocaLeReg against SIGReg at 100 vs at 800 epochs, on the same encoder.
#
# RECIPE WARNING: hvit_sigreg_paper / hvit_rdmreg_paper ran at lr 2e-3 /
# warmup 1, everything else at lr 1e-3 / warmup 10. Learning-SPEED comparisons
# are exactly where that confound bites hardest -- a higher LR moves early
# epochs most. Compare LocaLeReg against the *_matched arms for any claim about
# speed, and treat the *_paper arms as the paper-recipe reference only.

device: null
dataset: imagenette
data_dir: data/imagenette
imagenette_variant: 160px
split: val
crop_size: 128

batch_size: 128        # sized for the 10GB card on diufrd202; inference only
num_workers: 8

output_folder: logs/eval_snapshots_geometric
cache_dir: logs/eval_snapshots_geometric/cache

standardize: true
n_neighbors: 15         # k-NN graph for the curvature gap
knn_k: 20               # k for the leave-one-out k-NN accuracy
n_jobs: 8
epoch_stride: 1         # every snapshot; the early epochs are the point here

runs:
  # matched recipe -- the arms a speed claim may use
  - {name: hvit_sigreg_matched, experiment: lejepa/hvit_imagenette_sigreg,          dir: checkpoints/hvit_sigreg_matched}
  - {name: hvit_rdmreg_matched, experiment: rectifiedlpjepa/hvit_imagenette_rdmreg, dir: checkpoints/hvit_rdmreg_matched}
  - {name: hvit_locale_k2,      experiment: lejepa/hvit_imagenette_localballreg_l01_k2, dir: checkpoints/hvit_locale_k2}
  - {name: hvit_locale_k4,      experiment: lejepa/hvit_imagenette_localballreg_l01_k4, dir: checkpoints/hvit_locale_k4}
  - {name: hvit_locale_k8,      experiment: lejepa/hvit_imagenette_localballreg_l01_k8, dir: checkpoints/hvit_locale_k8}
  # paper recipe -- reference only, NOT for speed comparisons (see above)
  - {name: hvit_sigreg_paper,   experiment: lejepa/hvit_imagenette_sigreg,          dir: checkpoints/hvit_sigreg_paper}
  - {name: hvit_rdmreg_paper,   experiment: rectifiedlpjepa/hvit_imagenette_rdmreg, dir: checkpoints/hvit_rdmreg_paper}
