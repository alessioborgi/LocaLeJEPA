method: lejepa

backbone:
  name:     resnet50
  emb_dim:  2048
  proj_dim: 128

data:
  dataset:               imagenet100
  root_path:             /path/to/imagenet
  image_folder:          imagenet_full_size/
  class_subset_file:     /path/to/imagenet100_classes.txt   # one synset per line
  batch_size:            256
  num_workers:           8
  pin_mem:               true
  crop_size:             224
  num_global_crops:      2
  num_local_crops:       6
  global_crop_scale:     [0.3, 1.0]
  local_crop_scale:      [0.05, 0.3]
  record_metadata:       true
  copy_data:             false
  use_gaussian_blur:     true
  use_horizontal_flip:   true
  use_color_distortion:  true
  color_jitter_strength: 0.8

lejepa:
  lamb:        0.02
  num_classes: 100
  use_probe:   true

optimization:
  use_bfloat16:       true
  epochs:             500
  warmup:             1
  lr:                 5.0e-4
  weight_decay:       5.0e-4
  probe_lr:           1.0e-3
  probe_weight_decay: 1.0e-7

logging:
  folder:          logs/lejepa/rn50_in100_ep500/
  write_tag:       lejepa
  load_checkpoint: false
  read_checkpoint: null
  use_wandb:       false
