# LeJEPA — VOC07+12 Faster R-CNN detection config
#
# Requires: detectron2 + ResNet-50 LeJEPA checkpoint
# Usage: python eval_voc.py --config configs/lejepa/finetuning/eval_voc.yaml

# ── Pretrained model ─────────────────────────────────────────────────────────
checkpoint:      logs/lejepa/rn50_in100_ep500/lejepa-latest.pth.tar
pretrain_config: logs/lejepa/rn50_in100_ep500/params-lejepa.yaml

# ── VOC dataset ───────────────────────────────────────────────────────────────
voc_root: /path/to/VOCdevkit

# ── Training ──────────────────────────────────────────────────────────────────
output_dir:   logs/lejepa/voc_detection/
base_lr:      0.1
max_iter:     24000
warmup_iters: 1000
batch_size:   16
