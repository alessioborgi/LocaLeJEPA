# NOTE: ImageNet-22K (IN22k) dataloader is not implemented.
# Implement an IN22k data loader matching your storage format, then update the paths below.

method: ijepa

backbone:
  name:         vit
  vit_size:     vit_huge
  patch_size:   14
  pred_depth:   12
  pred_emb_dim: 384

data:
  dataset:               imagenet1k
  batch_size:            32
  num_workers:           10
  pin_mem:               true
  root_path:             $replace_this_with_absolute_path_to_your_datasets_directory
  image_folder:          imagenet_full_size/061417/
  crop_size:             224
  crop_scale:            [0.3, 1.0]
  copy_data:             false
  use_gaussian_blur:     false
  use_horizontal_flip:   false
  use_color_distortion:  false
  color_jitter_strength: 0.0

ijepa:
  allow_overlap:   false
  aspect_ratio:    [0.75, 1.5]
  enc_mask_scale:  [0.85, 1.0]
  min_keep:        10
  num_enc_masks:   1
  num_pred_masks:  4
  pred_mask_scale: [0.15, 0.2]

optimization:
  use_bfloat16:       true
  epochs:             66
  warmup:             3
  lr:                 1.0e-3
  start_lr:           2.0e-4
  final_lr:           1.0e-6
  weight_decay:       0.04
  final_weight_decay: 0.4
  ipe_scale:          1.0
  ema:                [0.996, 1.0]

logging:
  folder:          logs/jepa/vith14_in22k_ep66/
  write_tag:       jepa
  load_checkpoint: false
  read_checkpoint: null
