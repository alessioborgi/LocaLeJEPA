# I-JEPA — VOC07+12 Faster R-CNN detection config
#
# Requires: detectron2 + ResNet-50 I-JEPA checkpoint
# Usage: python eval_voc.py --config configs/jepa/finetuning/eval_voc.yaml

# ── Pretrained model ─────────────────────────────────────────────────────────
checkpoint:      logs/jepa/vith14_in1k_ep300/jepa-latest.pth.tar
pretrain_config: logs/jepa/vith14_in1k_ep300/params-ijepa.yaml

# ── VOC dataset ───────────────────────────────────────────────────────────────
voc_root: /path/to/VOCdevkit

# ── Training ──────────────────────────────────────────────────────────────────
output_dir:   logs/jepa/voc_detection/
base_lr:      0.1
max_iter:     24000
warmup_iters: 1000
batch_size:   16
