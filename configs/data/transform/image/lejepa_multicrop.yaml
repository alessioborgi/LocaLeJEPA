_target_: src.data.transforms.transforms.MultiCropTransform
num_global_crops: 2
num_local_crops: 6

global_transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: torchvision.transforms.RandomResizedCrop
      size: ${data.crop_size}
      scale: [ 0.3, 1.0 ]
    - _target_: torchvision.transforms.RandomHorizontalFlip
    - _target_: torchvision.transforms.RandomApply
      p: 0.8
      transforms:
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.64
          contrast: 0.64
          saturation: 0.64
          hue: 0.16
    - _target_: torchvision.transforms.RandomGrayscale
      p: 0.2
    - _target_: torchvision.transforms.RandomApply
      p: 0.5
      transforms:
        - _target_: torchvision.transforms.GaussianBlur
          kernel_size: 23
          sigma: [ 0.1, 2.0 ]
    - _target_: torchvision.transforms.RandomApply
      p: 0.2
      transforms:
        - _target_: torchvision.transforms.RandomSolarize
          threshold: 128
          p: 0.5
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [ 0.485, 0.456, 0.406 ]
      std: [ 0.229, 0.224, 0.225 ]

local_transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: torchvision.transforms.RandomResizedCrop
      size: ${data.crop_size}
      scale: [ 0.05, 0.3 ]
    - _target_: torchvision.transforms.RandomHorizontalFlip
    - _target_: torchvision.transforms.RandomApply
      p: 0.8
      transforms:
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.64
          contrast: 0.64
          saturation: 0.64
          hue: 0.16
    - _target_: torchvision.transforms.RandomGrayscale
      p: 0.2
    - _target_: torchvision.transforms.RandomApply
      p: 0.5
      transforms:
        - _target_: torchvision.transforms.GaussianBlur
          kernel_size: 23
          sigma: [ 0.1, 2.0 ]
    - _target_: torchvision.transforms.RandomApply
      p: 0.2
      transforms:
        - _target_: torchvision.transforms.RandomSolarize
          threshold: 128
          p: 0.5
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [ 0.485, 0.456, 0.406 ]
      std: [ 0.229, 0.224, 0.225 ]
