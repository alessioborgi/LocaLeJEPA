# Appearance-only views. No crop and no flip: the turntable angle is the signal, and a
# flip would make the invariance term identify a pose with its mirror, folding each
# object's circle into an arc.
_target_: src.data.transforms.image.MultiViewTransform
num_views: 4

base_transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: torchvision.transforms.Resize
      size: ["${data.crop_size}", "${data.crop_size}"]
    - _target_: torchvision.transforms.RandomApply
      p: 0.8
      transforms:
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.4
          contrast: 0.4
          saturation: 0.4
          hue: 0.1
    - _target_: torchvision.transforms.RandomGrayscale
      p: 0.2
    - _target_: torchvision.transforms.RandomApply
      p: 0.5
      transforms:
        - _target_: torchvision.transforms.GaussianBlur
          kernel_size: 9
          sigma: [0.1, 2.0]
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
