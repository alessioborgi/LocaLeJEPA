_target_: src.transforms.MultiViewTransform
num_views: 4
base_transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: torchvision.transforms.RandomResizedCrop
      size: ${data.crop_size}
      scale: [0.08, 1.0]
    - _target_: torchvision.transforms.RandomHorizontalFlip
    - _target_: torchvision.transforms.RandomApply
      p: 0.8
      transforms:
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.6400000000000001
          contrast: 0.6400000000000001
          saturation: 0.6400000000000001
          hue: 0.16000000000000003
    - _target_: torchvision.transforms.RandomGrayscale
      p: 0.2
    - _target_: torchvision.transforms.RandomApply
      p: 0.5
      transforms:
        - _target_: torchvision.transforms.GaussianBlur
          kernel_size: 23
          sigma: [0.1, 2.0]
    - _target_: torchvision.transforms.RandomApply
      p: 0.2
      transforms:
        - _target_: torchvision.transforms.RandomSolarize
          threshold: 128
          p: 0.5
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
