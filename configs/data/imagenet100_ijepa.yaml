defaults:
  - transform/image@train_transform: ijepa_train
  - _self_

_target_: src.data.imagenet1k_datamodule.ImageNet1KDataModule
has_test_data: false

data_dir: ${paths.data_dir}/imagenet
image_folder: imagenet_full_size/
tar_file: imagenet_full_size-061417.tar.gz

batch_size: 256
num_workers: 8
pin_memory: true
persistent_workers: false
drop_last: true

copy_data: false
class_subset_file: ${paths.class_subset_dir}/imagenet100_hobbitlong.txt

crop_size: 224

collator:
  _target_: src.ijepa.masks.multiblock.MaskCollator
  input_size: ${data.crop_size}
  patch_size: 16
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  nenc: 1
  npred: 4
  min_keep: 4
  allow_overlap: false
