defaults:
  - transform/image@train_transform: ijepa_train
  - _self_

_target_: src.data.stl10_datamodule.STL10DataModule
has_test_data: false

data_dir: ${paths.data_dir}/stl10
train_split: unlabeled

batch_size: 256
num_workers: 4
pin_memory: true
persistent_workers: null
drop_last: true

crop_size: 224

collator:
  _target_: src.data.transforms.mask_collator.MultiBlockMaskCollator
  input_size: ${data.crop_size}
  patch_size: 16
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  nenc: 1
  npred: 4
  min_keep: 4
  allow_overlap: false
