defaults:
  - model_checkpoint
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  # Keep the BEST checkpoint (by validation online-probe accuracy) at a stable
  # path best.ckpt, plus last.ckpt for the final-epoch weights. The campaign's
  # headline numbers come from last.ckpt (no selection on the reported split --
  # state/10-PAPER-STATE.md PD-4); best.ckpt feeds a labelled secondary column.
  # Runs without an online probe override monitor: null in their experiment
  # config (they fall back to keeping the last checkpoint).
  filename: "best"
  monitor: "val/probe_acc"
  mode: "max"
  save_top_k: 1
  save_last: True
  auto_insert_metric_name: False

model_summary:
  max_depth: -1

# A checkpoint written when training is interrupted by an exception -- which is what
# Lightning turns a SIGTERM into (Slurm's --signal before the wall, or a preemption). A
# wall or preemption then costs the partial epoch, not the run: the launcher's resume
# decision (scripts/aicr/campaign.py) picks whichever of last.ckpt / on_exception.ckpt
# holds the larger global_step, read from inside the file.
on_exception:
  _target_: lightning.pytorch.callbacks.OnExceptionCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "on_exception"
