# Yoda (bobblehead) linear-probe eval of the two *local*-regularizer ViT-S/8
# backbones (vit_imagenette_local_sigreg / vit_imagenette_local_ballreg), to be
# appended to the multi-seed comparison table in report.md.
#
#   python eval_angle_probe.py           --config configs/eval_angle_probe_yoda_vit_local.yaml
#   python eval_angle_probe_multiseed.py --config configs/eval_angle_probe_yoda_vit_local.yaml --n-seeds 10
#
# Same probe settings (full 8097 frames, 60/20/20 split) as the other configs,
# so the numbers are directly comparable to the existing rows.

device: null
crop_size: 128
data_dir: data
output_folder: logs/eval_angle_probe_yoda_vit_local
cache_dir: logs/eval_angle_probe_yoda_vit_local/cache

subsample: 1            # all 8097 frames
max_frames: null

batch_size: 256
num_workers: 8

angle_labels: ["figure 0", "figure 1"]

backbones:
  - name: vit_localsigreg
    experiment: lejepa/vit_imagenette_local_sigreg
    checkpoint: checkpoints/vit_imagenette_local_sigreg/last.ckpt
  - name: vit_localballreg
    experiment: lejepa/vit_imagenette_local_ballreg
    checkpoint: checkpoints/vit_imagenette_local_ballreg/last.ckpt

probe:
  test_frac: 0.2
  val_frac: 0.2
  ridge_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  standardize: true
  seed: 0
