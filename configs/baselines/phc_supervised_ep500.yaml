# Supervised PhC baseline — same CNN+FC arch, 3 000 labeled samples, no pretraining
# Usage: python main.py --fname configs/baselines/phc_supervised_ep500.yaml

method: phc_supervised

backbone:
  emb_dim: 1024

data:
  dataset:          phc_blob          # phc_blob | phc_gpm
  path:             /path/to/phc.npz
  batch_size:       64
  num_workers:      4
  pin_mem:          true
  n_labeled:        3000
  train_frac:       0.6
  seed:             42
  use_c4v:          true
  use_mirror:       false
  use_roll:         true
  use_refractive:   true
  refractive_range: [0.8, 1.2]

optimization:
  epochs:       500
  lr:           1.0e-3
  weight_decay: 1.0e-4
  use_bfloat16: true

logging:
  folder:          logs/baselines/phc_supervised/
  write_tag:       phc-supervised
  load_checkpoint: false
  read_checkpoint: ~
  use_wandb:       false
