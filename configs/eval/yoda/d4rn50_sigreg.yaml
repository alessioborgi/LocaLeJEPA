device: null
crop_size: 128
data_dir: data
output_folder: logs/eval_angle_probe_yoda_d4rn50_sigreg
cache_dir: logs/eval_angle_probe_yoda_d4rn50_sigreg/cache

subsample: 1            # all 8097 frames
max_frames: null

batch_size: 256
num_workers: 8

angle_labels: ["figure 0", "figure 1"]

backbones:
  - name: d4rn50_sigreg
    experiment: lejepa/d4rn50_imagenette_sigreg
    checkpoint: checkpoints/lejepa_d4rn50_imagenette_sigreg/best.ckpt

probe:
  test_frac: 0.2
  val_frac: 0.2
  ridge_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  standardize: true
  seed: 0
