device: null
crop_size: 224   # paper eval resolution (ViT-L/14)
data_dir: data
output_folder: logs/eval_angle_probe_yoda_vitl14_sigreg_in1k_paper
cache_dir: logs/eval_angle_probe_yoda_vitl14_sigreg_in1k_paper/cache
subsample: 1
max_frames: null
batch_size: 128
num_workers: 8
angle_labels: ["figure 0", "figure 1"]
backbones:
  - name: vitl14_sigreg_in1k_paper
    experiment: lejepa/vitl14_in1k_sigreg_paper
    checkpoint: checkpoints/vitl14_in1k_sigreg_paper/best.ckpt
probe:
