device: null
crop_size: 128
data_dir: data
output_folder: logs/eval_angle_probe_yoda_localballreg_dynk
cache_dir: logs/eval_angle_probe_yoda_localballreg_dynk/cache

subsample: 1            # all 8097 frames
max_frames: null

batch_size: 256
num_workers: 8

angle_labels: ["figure 0", "figure 1"]

backbones:
  # NOTE: the gpu_requeue pretrain job was preempted ~epoch 42 then restarted from
  # scratch (0->799). Lightning versioned the real checkpoints: best.ckpt (epoch 35)
  # and last.ckpt (epoch 42) are STALE from the preempted first attempt; the true
  # best-by-val/probe_acc is best-v1.ckpt (epoch 727) and the true final is
  # last-v1.ckpt (epoch 799). Epoch 35 sits in the k=1 phase and never sees the
  # dynamic anneal, so we pin best-v1.ckpt (verified epoch 727, deep in k=8).
  - name: localballreg_l0.1_dynk
    experiment: lejepa/vit_imagenette_local_ballreg_dynk
    checkpoint: checkpoints/local_ballreg_dynk_l0.1/best-v1.ckpt

probe:
  test_frac: 0.2
  val_frac: 0.2
  ridge_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  standardize: true
  seed: 0
