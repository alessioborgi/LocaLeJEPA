device: null
crop_size: 128
data_dir: data
output_folder: logs/eval_angle_probe_yoda_local_healthy
cache_dir: logs/eval_angle_probe_yoda_local_healthy/cache

subsample: 1
max_frames: null
batch_size: 256
num_workers: 8
angle_labels: ["figure 0", "figure 1"]

backbones:
  - name: localballreg_l0.1_k4
    experiment: lejepa/vit_imagenette_local_ballreg
    checkpoint: checkpoints/sweep_local/local_ballreg_lamb0.1_k4/best.ckpt
  - name: localballreg_l0.1_k2
    experiment: lejepa/vit_imagenette_local_ballreg
    checkpoint: checkpoints/sweep_local/local_ballreg_lamb0.1_k2/best.ckpt
  - name: localballreg_l0.3_k2
    experiment: lejepa/vit_imagenette_local_ballreg
    checkpoint: checkpoints/sweep_local/local_ballreg_lamb0.3_k2/best.ckpt
  - name: localsigreg_l0.1_k4
    experiment: lejepa/vit_imagenette_local_sigreg
    checkpoint: checkpoints/sweep_local/local_sigreg_lamb0.1_k4/best.ckpt

probe:
  test_frac: 0.2
  val_frac: 0.2
  ridge_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  standardize: true
  seed: 0
