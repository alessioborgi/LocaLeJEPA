# Imagenette example only. For other datasets supply their preprocessing and paths.
image_root: data/imagenette/imagenette2-160/val
image_mode: RGB
normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
class_aliases:
  tench: n01440764
  English springer: n02102040
  cassette player: n02979186
  chain saw: n03000684
  church: n03028079
  French horn: n03394916
  garbage truck: n03417042
  gas pump: n03425413
  golf ball: n03445777
  parachute: n03888257
crop_size: 128
# Three English springers, with input / LocaLeJEPA / LeJEPA columns.
classes: [English springer]
comparison: true
rgb_order: '312'  # R=PC3, G=PC1, B=PC2; display-only permutation.
backbones:
  - name: H_LocaLe_K4
    label: LocaLeJEPA
    experiment: lejepa/vit_imagenette_localballreg_l01_k4
    overrides: [model/encoder=hvit_small_p8]
    checkpoint: checkpoints/hvit_locale_k4/snapshots/snap_epoch0099.ckpt
  - name: H_SIGReg
    label: LeJEPA
    experiment: lejepa/hvit_imagenette_sigreg
    checkpoint: checkpoints/hvit_sigreg_matched/snapshots/snap_epoch0099.ckpt
