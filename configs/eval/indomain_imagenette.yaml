#
# Note svit_susreg is the only SUSReg (SPHERE-JEPA) checkpoint available; the
# SIGReg rows use different backbones, so cross-row differences mix the
# regulariser with the architecture.

device: null
seed: 0

dataset: imagenette
data_dir: data/imagenette
imagenette_variant: 160px

crop_size: 128

batch_size: 256
num_workers: 8

output_folder: logs/eval_indomain_imagenette
cache_dir: logs/eval_indomain_imagenette/cache

train_subset_per_class: null

knn:
  k_values: [10, 20, 100, 200]
  temperature: 0.07
  report_k: 20
  chunk_size: 512

linear:
  lr_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  epochs: 100
  batch_size: 1024
  weight_decay: 0.0
  momentum: 0.9
  standardize: true
  val_frac: 0.1

backbones:
  # SUSReg -- SPHERE-JEPA's hyperspherical-uniformity regulariser.
  - name: svit_susreg
    experiment: lejepa/svit_imagenette_susreg
    checkpoint: checkpoints/svit_imagenette_susreg/last.ckpt

  # SIGReg -- LeJEPA's isotropic-Gaussian regulariser.
  - name: vit_sigreg
    experiment: lejepa/vit_imagenette_sigreg
    checkpoint: checkpoints/vit_imagenette_sigreg/epoch_795.ckpt

  - name: nvit_sigreg
    experiment: lejepa/nvit_imagenette_sigreg
    checkpoint: checkpoints/nvit_imagenette_sigreg/last.ckpt

  - name: nvit_subreg
    experiment: lejepa/nvit_imagenette_subreg
    checkpoint: checkpoints/nvit_imagenette_subreg/last.ckpt

  - name: vit_rdmreg
    experiment: rectifiedlpjepa/vit_imagenette_rdmreg
    checkpoint: checkpoints/rectifiedlpjepa_imagenette_rdmreg/best.ckpt

  # Both Imagenette D4-ResNet-50 checkpoints predate the switch of
  # configs/model/encoder/d4resnet50.yaml to `pool: equivariant`: their weights
  # carry the old D4-invariant head (gpool + fc), so the encoder must be rebuilt
  # with pool=group or the state_dict will not match. The IN1K D4 checkpoints
  # were trained after the switch and need no override.
  - name: d4rn50_sigreg
    experiment: lejepa/d4rn50_imagenette_sigreg
    checkpoint: checkpoints/lejepa_d4rn50_imagenette_sigreg/best.ckpt
    overrides: ["model.encoder.pool=group"]

  - name: d4rn50_rdmreg
    experiment: rectifiedlpjepa/d4rn50_imagenette_rdmreg
    checkpoint: checkpoints/rectifiedlpjepa_d4rn50_imagenette_rdmreg/best.ckpt
    overrides: ["model.encoder.pool=group"]
