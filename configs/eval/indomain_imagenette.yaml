# In-domain k-NN + linear evaluation on Imagenette, same protocol as
# configs/eval/indomain_in1k.yaml (SPHERE-JEPA Table 3) but on the small
# 9469-train / 3925-val 10-class dataset the Imagenette backbones were
# pretrained on. Runs in minutes, so it also serves as the smoke test for the
# ImageNet-1K jobs.
