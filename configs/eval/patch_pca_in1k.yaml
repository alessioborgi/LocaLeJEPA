# ImageNet-1K (100-epoch pretrains, crop 128) patch-PCA config.
# Filled from configs/eval/patch_pca_template.yaml.
#
# Images: the HF-staged val split (scripts/stage_imagenet1k_hf.py), whose class
# folders are the zero-padded HF label index (0000..0999) = the standard sorted
# WordNet-id order, so 0217 = n02102040 "English springer". class_aliases maps
# the timm ImageNetInfo first lemma of every class to its folder, so --classes
# accepts either "English springer" or 0217. Duplicate lemmas carry the index.
#
# Preprocessing = the LeJEPA eval transform used for the online probe and all
# IN1K evals (configs/data/transform/image/lejepa_eval.yaml): Resize(128) +
# CenterCrop(128) + ImageNet mean/std.
#
# Backbones: every IN1K checkpoint whose spatial tokens the extractor supports
# (timm ViT-S/8 and Hyperbolic ViT-S/8; H-ViT uses its Euclidean body). The
# D4-equivariant ResNet-50 runs have no patch grid and are omitted. Headline
# checkpoints are last.ckpt (epoch 99 = 100 ep., same as the Table 3 rows);
# hvit_localballreg_l01_dynk reached epoch 99 on 2026-09-21 and is included; the
# ViT-L/14 paper-setting runs (crop 224) are still training and are left out.
#
#   python src/visualize_patch_pca.py --config configs/eval/patch_pca_in1k.yaml \
#     --only vit_localballreg_l01_k4 --scope group --classes "English springer" \
#     --per-class 5 --seed 42 --out logs/patch_pca_in1k --overwrite
image_root: data/imagenet/imagenet_full_size/061417/val
image_mode: RGB
normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
crop_size: 128
backbones:
  # plain timm ViT-S/8
  - name: vit_sigreg
    experiment: lejepa/vit_in1k_sigreg
    checkpoint: checkpoints/lejepa_vit_in1k_sigreg/last.ckpt
  - name: vit_localballreg_l01_k4
    experiment: lejepa/vit_in1k_localballreg_l01_k4
    checkpoint: checkpoints/lejepa_vit_in1k_localballreg_l01_k4/last.ckpt
  # Hyperbolic ViT-S/8 (Euclidean body tokens, before the hyperbolic head)
  - name: hvit_sigreg
    experiment: lejepa/hvit_in1k_sigreg
    checkpoint: checkpoints/lejepa_hvit_in1k_sigreg/last.ckpt
  - name: hvit_rdmreg
    experiment: rectifiedlpjepa/hvit_in1k_rdmreg
    checkpoint: checkpoints/rectifiedlpjepa_hvit_in1k_rdmreg/last.ckpt
  - name: hvit_localballreg_l01_k2
    experiment: lejepa/hvit_in1k_localballreg_l01_k2
    checkpoint: checkpoints/lejepa_hvit_in1k_localballreg_l01_k2/last.ckpt
  - name: hvit_localballreg_l01_k4
    experiment: lejepa/hvit_in1k_localballreg_l01_k4
    checkpoint: checkpoints/lejepa_hvit_in1k_localballreg_l01_k4/last.ckpt
  - name: hvit_localballreg_l03_k2
    experiment: lejepa/hvit_in1k_localballreg_l03_k2
    checkpoint: checkpoints/lejepa_hvit_in1k_localballreg_l03_k2/last.ckpt
  - name: hvit_localballreg_l01_dynk
    experiment: lejepa/hvit_in1k_localballreg_l01_dynk
    checkpoint: checkpoints/lejepa_hvit_in1k_localballreg_l01_dynk/last.ckpt
  - name: hvit_localsigreg_l01_k4
    experiment: lejepa/hvit_in1k_localsigreg_l01_k4
    checkpoint: checkpoints/lejepa_hvit_in1k_localsigreg_l01_k4/last.ckpt
