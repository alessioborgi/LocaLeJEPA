# Whole-repo coverage: Tier A *and* Tier B, reported without a floor.
#
#     pytest --cov=src --cov-branch --cov-config=tests/coverage-full.cfg
#
# pyproject.toml's config is the gate and covers Tier A only (the code that decides what gets
# computed). This one answers the different question "how much of src/ runs under the suite",
# and deliberately has no fail_under: the entry points are orchestration, their number will stay
# low, and a floor here would either be meaningless or would pressure someone into writing
# mock-heavy tests of glue code. Reported so the gap is visible rather than hidden by the omit
# list -- research_rules/06: state the number you are not gating on, too.

[run]
branch = True
source = src
omit =
    # Vendored / not instantiable -- the same exclusions the gate uses, for the same reasons.
    src/models/components/e2resnet.py
    src/models/components/vision_transformer.py
    src/models/components/tensor_ops.py
    src/models/components/nvit.py
    src/models/components/spherical_vit.py
    src/utils/rich_utils.py

[report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
    if TYPE_CHECKING:
