[project]
name = "bundlejepa"
version = "0.1.0"
description = "BundLeJEPA: LeJEPA-style self-supervised pretraining with local (k-means neighbourhood) distribution-matching regularizers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Alessio Borgi" },
    { name = "Pavel Snopov" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # training
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "lightning>=2.6.1",
    "timm>=1.0.26",
    "fast-pytorch-kmeans>=0.2.2",
    "psutil>=5.9",  # imported by fast_pytorch_kmeans but not declared by it
    # configuration / logging
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "omegaconf>=2.3.0",
    "rootutils>=1.0.7",
    "rich>=13.0",
    "wandb>=0.18",
    "pyyaml>=6.0",
    # data / eval
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# D4-equivariant ResNet-50 encoder (configs/model/encoder/d4resnet50.yaml).
# escnn pulls in py3nj, a Fortran extension built from source: needs gfortran + Python headers.
equivariant = ["escnn>=1.0.11"]
# ImageNet-1K staging from HuggingFace (scripts/stage_imagenet1k_hf.py).
imagenet = ["datasets>=3.0", "huggingface-hub>=0.25"]
# Experiments branch: analysis, plots, PhC datasets (h5py), RankMe/transfer/Yoda scripts.
experiments = ["matplotlib>=3.9", "scipy>=1.13", "scikit-learn>=1.4", "h5py>=3.10"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# The lock targets Linux x86_64 (CUDA wheels; lie-learn ships Linux-only wheels).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# lie-learn (escnn dependency) >= 0.0.2 has prebuilt wheels; the older sdist does not build.
constraint-dependencies = ["lie-learn>=0.0.2"]
