[project]
name = "localejepa"
version = "1.0.0"
description = "LocaLeJEPA: LeJEPA-style self-supervised pretraining with local (k-means neighbourhood) distribution-matching regularizers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alessio Borgi" }, { name = "Pavel Snopov" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # training
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "lightning>=2.6.1",
    "timm>=1.0.26",
    "fast-pytorch-kmeans>=0.2.2",
    "psutil>=5.9",                # imported by fast_pytorch_kmeans but not declared by it
    # configuration / logging
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "omegaconf>=2.3.0",
    "rootutils>=1.0.7",
    "rich>=13.0",
    "wandb>=0.18",
    "pyyaml>=6.0",
    # data / eval
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# D4-equivariant ResNet-50 encoder (configs/model/encoder/d4resnet50.yaml).
# escnn pulls in py3nj, a Fortran extension built from source: needs gfortran + Python headers.
equivariant = ["escnn>=1.0.11"]
# ImageNet-1K staging from HuggingFace (scripts/stage_imagenet1k_hf.py).
imagenet = ["datasets>=3.0", "huggingface-hub>=0.25"]
# Experiments branch: analysis, plots, RankMe/transfer/Yoda scripts.
experiments = [
    "matplotlib>=3.9",
    "scipy>=1.13",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
# testpaths is load-bearing, not tidiness: every src/eval_*.py runs rootutils.setup_root() at
# import, and scripts/verify_indomain_result.py does json.load(open(...)) at import. Collecting
# over src/ or scripts/ would execute those side effects.
testpaths = ["tests"]
addopts = "-m 'not gpu' --strict-markers"
markers = [
    "gpu: requires CUDA; run inside an allocation with `pytest -m gpu`",
    "slow: excluded from the fast pre-commit run",
]

[tool.coverage.run]
branch = true          # the defects we care about live in if-branches that line coverage
                       # can satisfy by never taking
source = ["src"]
omit = [
    # Vendored from equivision; escnn is not installed on either machine, so it cannot even
    # be imported. We would not fix a defect found in it.
    "src/models/components/e2resnet.py",
    # Vendored from I-JEPA (Meta).
    "src/models/components/vision_transformer.py",
    "src/models/components/tensor_ops.py",
    # nGPT-reference models. No config in the campaign instantiates either of them.
    "src/models/components/nvit.py",
    "src/models/components/spherical_vit.py",
    # Prompts stdin (rich.prompt.Prompt.ask) and writes files as a side effect.
    "src/utils/rich_utils.py",

    # --- TIER B ---------------------------------------------------------------------------
    # Entry points. Their main() bodies are orchestration over checkpoints, datasets and the
    # network; faking those at scale costs more than it protects. Omitted from THIS config so
    # the 95% floor means "the code that decides what gets computed", not an average diluted by
    # untestable glue.
    #
    # They are NOT untested and NOT unmeasured: their separable helpers are covered in
    # tests/helpers/test_report_helpers.py, and their coverage is reported without a floor by
    #     pytest --cov=src --cov-branch --cov-config=tests/coverage-full.cfg
    # which is the config to use when asking "how much of the repo is covered".
    "src/eval_*.py",
    "src/train.py",
    "src/visualize_patch_pca.py",
]

[tool.coverage.report]
fail_under = 95        # Tier A only -- see the TIER B note in the omit list above
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.uv]
# The lock targets Linux x86_64 (CUDA wheels) and macOS.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]
# lie-learn (escnn dependency) >= 0.0.2 has prebuilt wheels; the older sdist does not build.
constraint-dependencies = ["lie-learn>=0.0.2"]

[tool.uv.sources]
# lie-learn wheels are manylinux-only; on macOS build from git
lie-learn = { git = "https://github.com/AMLab-Amsterdam/lie_learn", marker = "sys_platform == 'darwin'" }
